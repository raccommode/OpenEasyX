name: Fast checks / publish
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker platforms to publish
        required: true
        default: linux/amd64,linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install recording test codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - run: python -m py_compile worker/subtitles.py
      - run: docker build --build-arg APP_VERSION=ci-test -t open-easyx:ci .
      - name: Test Docker runtime with an Unraid-style volume
        shell: bash
        run: |
          volume="open-easyx-ci-data-${GITHUB_RUN_ID}"
          container="open-easyx-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume"
          docker run -d --name "$container" -e PUID=99 -e PGID=100 -v "$volume:/data" open-easyx:ci

          for attempt in {1..20}; do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/health').then(r => { if (!r.ok) process.exit(1) })" 2>/dev/null; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          docker exec "$container" sh -lc 'test "$(awk "/^Uid:/ { print \$2 }" /proc/1/status)" = 99 && test "$(cat /proc/1/comm)" = tini'
          docker exec "$container" sh -lc 'test -w /data && test -f /data/easyx.sqlite && test -f /data/open-easyx-library.sqlite'
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/health').then(r=>r.json()).then(v=>{if(v.product!=='Open EasyX'||!v.ok||v.version!=='ci-test')throw Error(JSON.stringify(v))})"
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/version').then(r=>r.json()).then(v=>{if(v.version!=='ci-test')throw Error(JSON.stringify(v))})"
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/plugin-repositories').then(r=>r.json()).then(v=>{if(!Array.isArray(v)||!v.find(x=>x.id==='official'&&!x.removable))throw Error(JSON.stringify(v))})"
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/plugins/org.easyx.manyvids/browser-login/start',{method:'POST'}).then(async r=>{const v=await r.json();if(!r.ok||!v.active||!v.viewerPath)throw Error(JSON.stringify(v))})"
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/browser/vnc.html').then(r=>{if(!r.ok)throw Error('noVNC '+r.status)})"
          docker cp scripts/browser-paste-smoke.mjs "$container:/tmp/browser-paste-smoke.mjs"
          docker exec "$container" node /tmp/browser-paste-smoke.mjs
          docker exec "$container" node -e "fetch('http://127.0.0.1:3210/api/plugins/org.easyx.manyvids/browser-login',{method:'DELETE'}).then(r=>{if(!r.ok)throw Error('stop '+r.status)})"
          sleep 1
          docker exec "$container" sh -lc 'if ps -eo stat | grep -q "^Z"; then exit 1; fi'

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute version (YEAR.WEEK.N)
        id: version
        run: |
          YEAR=$(date -u +%G)
          WEEK=$(date -u +%V)
          # Remove leading zero for clean version number
          WEEK_NUM=$((10#$WEEK))
          WEEK_PAD=$(printf "%02d" "$WEEK_NUM")

          # Find existing releases for this year.week prefix
          PREFIX="${YEAR}.${WEEK_PAD}"
          LATEST=$(gh release list --limit 100 --json tagName -q \
            "[.[] | select(.tagName | startswith(\"${PREFIX}.\"))] | length")

          N=$(( LATEST + 1 ))
          VERSION="${PREFIX}.${N}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/raccommode/open-easyx
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
