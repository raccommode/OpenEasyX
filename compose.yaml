services:
  open-easyx:
    image: ghcr.io/raccommode/open-easyx:latest
    pull_policy: always
    container_name: open-easyx
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      EASYX_DATA_DIR: /data
      EASYX_MEDIA_DIR: /media
      EASYX_EXTERNAL_PLUGINS_DIR: /plugins
      EASYX_SCAN_INTERVAL_MINUTES: ${EASYX_SCAN_INTERVAL_MINUTES:-10}
      EASYX_WHISPER_MODEL: ${EASYX_WHISPER_MODEL:-small}
      # Values come from the .env file next to this compose file (compose reads it
      # automatically for variable substitution).
      EASYX_EMBEDDED_SUBTITLE_WORKER: ${EASYX_EMBEDDED_SUBTITLE_WORKER:-false}
      EASYX_ENABLE_BROWSER_LOGIN: ${EASYX_ENABLE_BROWSER_LOGIN:-false}
      EASYX_SESSION_SECRET: ${EASYX_SESSION_SECRET:-}
      EASYX_ADMIN_PASSWORD: ${EASYX_ADMIN_PASSWORD:-}
      EASYX_COOKIE_SECURE: ${EASYX_COOKIE_SECURE:-false}
    volumes:
      - ./data:/data
      - ./media:/media
      - ./plugins-external:/plugins:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["javlibrary"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info

  # Optional TLS reverse proxy. Start with: docker compose --profile tls up -d
  # Edit deploy/Caddyfile.example first (set your domain), or mount your own.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EASYX_DOMAIN: ${EASYX_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-data:/data
      - ./deploy/caddy-config:/config
